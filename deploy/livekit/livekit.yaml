# LiveKit SFU — voice for videoke hangout rooms.
#
# API keys are injected via the LIVEKIT_KEYS env var (Coolify secret), e.g.
#   LIVEKIT_KEYS="devkey: <32+ char secret>"
# so they never live in this file.
port: 7880

rtc:
  # TCP fallback for networks that block UDP.
  tcp_port: 7881
  # Single multiplexed UDP port for WebRTC media — publish this on the host
  # (7882/udp) and open it in the VPS firewall. Coolify's proxy is HTTP-only,
  # so this port bypasses it by design.
  udp_port: 7882
  # Discover the host's public IP via STUN so ICE candidates are routable —
  # required inside Docker/NAT even on a public-IP VPS like Contabo.
  use_external_ip: true
