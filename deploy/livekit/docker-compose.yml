# Coolify: create a "Docker Compose (empty)" service, paste this file, and set
# the env vars below. Point a domain at port 7880 for the wss:// endpoint —
# Coolify's proxy terminates TLS for it. 7881/7882/3478 publish directly on the
# host (WebRTC media can't traverse the HTTP proxy); open 7882/udp and
# 3478/udp+tcp in the VPS firewall / Contabo panel firewall if one is assigned.
services:
  livekit:
    build: .
    command: --config /livekit.yaml
    expose:
      - '7880'
    ports:
      - '7881:7881'
      - '7882:7882/udp'
      # Built-in TURN relay for NAT-restricted clients (see livekit.yaml).
      - '3478:3478'
      - '3478:3478/udp'
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
    restart: always
