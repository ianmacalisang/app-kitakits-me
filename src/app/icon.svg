<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Emerald-400 → Emerald-500 → Teal-600 — matches the app's BrandMark gradient -->
    <linearGradient id="brand" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#34d399"/>
      <stop offset="50%"  stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- ── Letter K — bold, fully rounded; scaled ~25% to fill the canvas ── -->
  <g transform="translate(512 512) scale(1.25) translate(-512 -512)"
     fill="none" stroke="url(#brand)" stroke-width="170"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Vertical stem -->
    <path d="M 277,240 L 277,784"/>

    <!-- Arms as one chevron — rounded vertex forms the joint, lifted just
         above center for optical balance; 30° symmetric arms -->
    <path d="M 747,250 L 315,500 L 747,750"/>
  </g>
</svg>
