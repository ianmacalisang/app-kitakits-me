<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141414" />
    <title>Offline — Kitakits</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #fafafa;
        color: #141414;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 24px;
      }
      .tile {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(to bottom right, #404040, #2b2b2b, #1a1a1a);
        color: #fff;
        font-size: 22px;
        font-weight: 700;
        box-shadow: 0 4px 12px rgb(20 20 20 / 0.3);
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #737373;
        max-width: 280px;
      }
      button {
        margin-top: 8px;
        border: none;
        border-radius: 999px;
        background: #141414;
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        padding: 10px 24px;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0a;
          color: #fafafa;
        }
        p {
          color: #a3a3a3;
        }
        button {
          background: #fafafa;
          color: #141414;
        }
      }
    </style>
  </head>
  <body>
    <div class="tile">K</div>
    <h1>You're offline</h1>
    <p>Check your connection and try again. Pages you've visited recently are still available.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
